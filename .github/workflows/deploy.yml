name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Notify on build failure
        if: failure()
        run: |
          curl -L -X POST "${{ secrets.GAS_API_URL }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "key=${{ secrets.GAS_API_KEY }}" \
            --data-urlencode "to_email=${{ secrets.NOTIFY_EMAIL }}" \
            --data-urlencode "from_alias=GitHub CI" \
            --data-urlencode "email_subject=❌ Build failed on main" \
            --data-urlencode "email_body=<h2>Build failed</h2><p><b>Commit:</b> ${{ github.sha }}</p><p><b>By:</b> ${{ github.actor }}</p><p><b>Message:</b> ${{ github.event.head_commit.message }}</p><p><a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View logs</a></p>"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            DIR=$(find ~ -type d -name "*new-website*" -maxdepth 2 | head -n 1)
            if [ -n "$DIR" ]; then
              cd "$DIR"
              git fetch origin
              git reset --hard origin/main
            fi
            bash ~/deploy.sh
          command_timeout: 10m

      - name: Notify on deploy failure
        if: failure()
        run: |
          curl -L -X POST "${{ secrets.GAS_API_URL }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "key=${{ secrets.GAS_API_KEY }}" \
            --data-urlencode "to_email=${{ secrets.NOTIFY_EMAIL }}" \
            --data-urlencode "from_alias=GitHub CI" \